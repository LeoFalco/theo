name: Merge

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm merge execution'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  merge:
    environment:
      name: master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run merge
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FLUX_TOKEN: ${{ secrets.FLUX_TOKEN }}
        run: |
          gh auth status
          bun src/index.js merge --flux ${{ inputs.confirm && '--confirm' || '' }}
