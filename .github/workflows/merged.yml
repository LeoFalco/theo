name: Merged prs

on:
  schedule:
    # 21:00 UTC = 18:00 horário de Brasília (UTC-3), segunda a sexta
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    environment:
      name: master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Send to Google Chat
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          gh auth status
          bun src/index.js merged --team GRID --from today --to today --chat
